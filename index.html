<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="An ER gestalt trainer for rural emergency physicians.">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Doorway">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,300;1,8..60,400;1,8..60,600&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<title>The Doorway — ER Gestalt Trainer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0a0a0a;color:#f5f1e8;font-family:'Source Serif 4',Georgia,serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body,#root{min-height:100dvh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;transition:all 200ms cubic-bezier(0.2,0.8,0.2,1)}
input,textarea,select{font-family:inherit}
.scrollx::-webkit-scrollbar{display:none}.scrollx{scrollbar-width:none}
.display{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes vital-pulse{0%,100%{box-shadow:inset 0 0 0 1px rgba(239,68,68,0.4)}50%{box-shadow:inset 0 0 0 1px rgba(239,68,68,0.9),0 0 12px rgba(239,68,68,0.25)}}
@keyframes score-glow{0%,100%{text-shadow:none}50%{text-shadow:0 0 32px rgba(165,28,28,0.6),0 0 4px rgba(245,241,232,0.2)}}
@keyframes ekg-sweep{0%{stroke-dashoffset:2400}100%{stroke-dashoffset:0}}
@keyframes hr-flicker{0%,40%,100%{opacity:1}45%,55%{opacity:.55}}
@keyframes bubble-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes case-fade{from{opacity:0}to{opacity:1}}
@keyframes sheet-up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.bubble{animation:bubble-in 380ms cubic-bezier(0.2,0.8,0.2,1) both}
.case-fade{animation:case-fade 600ms cubic-bezier(0.2,0.8,0.2,1) both}
.sheet-up{animation:sheet-up 180ms cubic-bezier(0.2,0.8,0.2,1) both}
.vital-bad{animation:vital-pulse 1.5s cubic-bezier(0.2,0.8,0.2,1) infinite}
.chip:hover{background:#222}.chip:active{transform:scale(0.96)}
.score-glow{animation:score-glow 2.4s ease-in-out 1}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important}
}
#dw-fallback{display:none;min-height:100dvh;padding:48px 24px;max-width:480px;margin:0 auto;line-height:1.5}
#dw-fallback h1{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;font-size:32px;margin:0 0 12px}
#dw-fallback p{font-size:16px;color:#c9c3b6;margin:0 0 20px}
#dw-fallback button{min-height:44px;padding:12px 24px;background:#f5f1e8;color:#0a0a0a;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;letter-spacing:0.12em;text-transform:uppercase}
</style>
</head>
<body>
<div id="root"></div>

<div id="dw-fallback" role="alert">
  <h1>The Doorway didn't load.</h1>
  <p>Something stopped the app from starting. This is usually a dropped connection. Reload to try again. Your saved cases are stored on this device and are not affected.</p>
  <button type="button" onclick="location.reload()">Reload</button>
</div>

<noscript>
  <div style="padding:48px 24px;max-width:480px;margin:0 auto;line-height:1.5">
    <p>The Doorway needs JavaScript turned on.</p>
  </div>
</noscript>

<script>
// Load safety (SPEC A12): if the React app hasn't mounted within 10 s, or a
// script fails to load or throws during startup, show the plain fallback panel.
(function () {
  var shown = false;
  function showFallback() {
    if (shown || window.__dwMounted === true) return;
    shown = true;
    var fb = document.getElementById("dw-fallback");
    var root = document.getElementById("root");
    if (fb) fb.style.display = "block";
    if (root) root.style.display = "none";
  }
  window.__dwShowFallback = showFallback;
  // Resource load errors (a <script src> 404 or network failure) don't bubble,
  // so listen in the capture phase.
  window.addEventListener("error", function (e) {
    var t = e && e.target;
    if (t && t.tagName === "SCRIPT") { showFallback(); return; }
    if (t && t !== window) return; // e.g. an image or font failing: not fatal
    if (window.__dwMounted !== true) showFallback();
  }, true);
  setTimeout(function () { if (window.__dwMounted !== true) showFallback(); }, 10000);
})();
</script>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.12/babel.min.js"></script>
<script>
// VERSION: bump on every deploy. It is the one version number for the app: it busts the
// browser cache for the three app files (?v=) and names the service worker's cache
// (sw.js reads it from its own ?v= URL, so registering a new value installs a new worker).
var VERSION = "3.1.1";
window.DW_VERSION = VERSION;
document.write(
  '<script src="cases.js?v=' + VERSION + '"><\/script>' +
  '<script src="engine.js?v=' + VERSION + '"><\/script>' +
  '<script type="text/babel" data-presets="react" src="app.jsx?v=' + VERSION + '"><\/script>'
);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    try {
      navigator.serviceWorker.register("/sw.js?v=" + encodeURIComponent(window.DW_VERSION)).catch(function (err) {
        console.warn("Service worker registration failed:", err && err.message);
      });
    } catch (err) {
      console.warn("Service worker unavailable:", err && err.message);
    }
  });
}
</script>
</body>
</html>
